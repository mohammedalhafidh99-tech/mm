<style>
/* Layout: a phone-width column centred on larger screens, bottom tab bar, pushed screens with a back header.
   The look is the original dark green theme, kept as is, so one dark palette (no light variant). */
:root{
  --bg:#0D1311; --card:#16201C; --border:#22302A; --nav:#101814; --ring:#1E2B26;
  --text:#F2F7F4; --muted:#8FA39A; --green:#4ADE80; --green-d:#1B3326; --green-b:#285238;
  --protein:#7C9BFF; --protein-bg:#1B2540; --carbs:#FF9A4D; --carbs-bg:#3A2619;
  --fat:#FFD23F; --fat-bg:#38311A; --danger:#FF7A7A; --danger-bg:#1C1213; --danger-b:#5A2A2A;
  --font:'Tajawal',system-ui,'Segoe UI',Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:clamp(13px,4vw,16px);-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:pan-x pan-y}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font)}
body{font-size:1rem}
.field,.num,.dates input,#pickdate,#m-in{font-size:max(16px,1.1rem)!important}
input,button{touch-action:manipulation}
body{background:var(--bg);color:var(--text)}
button,input{font-family:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
#root{max-width:480px;margin:0 auto;min-height:100dvh;position:relative;background:var(--bg)}
.screen{padding:8px 16px 104px}
.screen.pushed{padding-bottom:24px}
.row{display:flex;align-items:center;gap:12px}
.col{min-width:0;flex:1}
.muted{color:var(--muted)}
.t-title{font-size:1.1875rem;font-weight:700;text-align:center;height:44px;display:flex;align-items:center;justify-content:center}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;display:block;width:100%;text-align:start}
button.card{cursor:pointer}
.card.pad-s{padding:8px 12px}
.card.row{display:flex}
.card.green{background:var(--green-d);border-color:var(--green-b)}
.ibox{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}
.ibox.round{border-radius:50%}
.ibox svg{width:22px;height:22px}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.btn-i{width:44px;height:44px;border-radius:50%;border:0;background:transparent;display:grid;place-items:center;color:var(--muted)}
.btn-i.fill{background:var(--green);color:var(--bg)}
.btn-i.out{border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);width:48px;height:48px}
.btn{width:100%;min-height:3.375rem;border-radius:14px;border:1px solid transparent;font-size:1.0625rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.btn.primary{background:var(--green);color:var(--bg)}
.btn.soft{background:var(--green-d);border-color:var(--green-b);color:var(--green);font-size:0.9375rem;min-height:3.125rem}
.btn.line{background:transparent;border-color:var(--green-b);color:var(--green)}
.btn.danger{background:var(--danger-bg);border-color:var(--danger-b);color:var(--danger)}
.btn:disabled{opacity:.4;cursor:default}
.chip{min-height:2.75rem;padding:0 16px;border-radius:14px;border:1px solid var(--border);background:var(--card);font-size:0.9375rem;font-weight:500;white-space:nowrap;color:var(--text)}
.chip.on{background:var(--green-d);border-color:var(--green);color:var(--green);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding:0 16px 4px;scrollbar-width:none}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.eq{flex-wrap:nowrap}.chips.eq .chip{flex:1;padding:0 4px;font-size:0.8125rem}
.field{width:100%;min-height:3.25rem;border-radius:14px;border:1px solid var(--border);background:var(--card);padding:0 14px;font-size:1rem;outline:none}
.field:focus{border-color:var(--green)}
.field-wrap{position:relative}
.field-wrap .field{padding-inline-start:44px;padding-inline-end:44px}
.field-wrap .pre{position:absolute;inset-inline-start:12px;top:0;bottom:0;display:grid;place-items:center;color:var(--muted);pointer-events:none}
.field-wrap .suf{position:absolute;inset-inline-end:0;top:0;bottom:0;width:44px}
.num{width:100px;min-height:2.75rem;text-align:center;font-size:1.25rem;font-weight:800;border-radius:12px;border:1px solid var(--border);background:var(--bg);outline:none;direction:ltr}
.num:focus{border-color:var(--green)}
.label{font-size:0.875rem;color:var(--muted);margin:0 0 8px}
.h2{font-size:1.0625rem;font-weight:700;margin:0}
.sp{height:12px}.sp8{height:8px}.sp16{height:16px}.sp20{height:20px}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;height:56px;padding:0 8px;font-size:1.1875rem;font-weight:700}
.hdr h1{font-size:1.1875rem;margin:0;flex:1;text-align:center;padding-inline-end:44px}
.nav{position:fixed;bottom:0;inset-inline:0;max-width:480px;margin:0 auto;background:var(--nav);border-top:1px solid var(--border);display:flex;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:10}
.nav button{flex:1;border:0;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:0.75rem;min-height:3.375rem;border-radius:14px}
.nav button.on{color:var(--green)}
.nav button.on .pill{background:var(--green-d)}
.pill{width:56px;height:30px;border-radius:15px;display:grid;place-items:center}
.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.macro{border-radius:16px;padding:12px;min-width:0}
.macro .n{font-size:1.3125rem;white-space:nowrap;font-weight:800;line-height:1.1;margin-top:6px}
.macro .n small{display:block;font-size:0.6875rem;margin-top:2px;font-weight:500;color:var(--muted)}
.macro .l{font-size:0.75rem;color:var(--muted)}
.bar{height:5px;border-radius:3px;background:rgba(255,255,255,.1);margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.tile-title{font-size:1rem;font-weight:700}
.tile-sub{font-size:0.8125rem;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.ring{width:min(196px,52vw);height:min(196px,52vw);margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .big{font-size:2.625rem;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.date-card{display:flex;align-items:center;padding:2px 4px;position:relative}
.date-mid{flex:1;text-align:center;padding:6px 0;position:relative}
.date-mid input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.food-macros{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:0.75rem}
.kc{text-align:center;flex:none}.kc b{font-size:1.25rem;font-weight:800;color:var(--green);display:block;line-height:1.2}.kc small{font-size:0.6875rem;color:var(--muted)}
.stick-bottom{position:sticky;bottom:0;background:var(--nav);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--border)}
.menu{padding:0 16px}
.menu button{width:100%;border:0;background:transparent;display:flex;align-items:center;gap:14px;min-height:3.375rem;font-size:1rem;text-align:start;color:var(--text)}
.menu button+button{border-top:1px solid var(--border)}
.menu .tr{color:var(--muted);font-size:0.875rem}
.divider{border-top:1px solid var(--border)}
.stat{display:flex;justify-content:space-between;align-items:center;min-height:2.875rem;gap:12px}
.stat+.stat{border-top:1px solid var(--border)}
.stat b{font-variant-numeric:tabular-nums;direction:ltr}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:3.25rem;margin:6px 0}
.sw input{appearance:none;width:50px;height:30px;border-radius:15px;background:var(--ring);border:1px solid var(--border);position:relative;cursor:pointer;flex:none;transition:background .15s}
.sw input::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--muted);transition:transform .15s}
.sw input:checked{background:var(--green-d);border-color:var(--green)}
.sw input:checked::after{background:var(--green);transform:translateX(-20px)}
.tabs3{display:flex;gap:8px}.tabs3 .chip{flex:1;padding:0}
.rng{display:flex;align-items:center;justify-content:space-between}
.rng b{font-size:1rem}
.chart{display:flex;gap:6px;height:178px;margin-top:4px}
.yax{width:34px;position:relative;flex:none}
.yax span{position:absolute;inset-inline-end:0;font-size:0.6875rem;color:var(--muted);transform:translateY(-50%)}
.plot{flex:1;position:relative;min-width:0}
.grid{position:absolute;inset-inline:0;height:1px;background:var(--ring)}
.cols{position:absolute;inset:0;display:flex}
.colbtn{flex:1;min-width:0;border:1px solid transparent;border-radius:10px;background:transparent;display:flex;flex-direction:column;padding:0}
.colbtn.on{background:var(--card);border-color:var(--border)}
.bars{height:140px;display:flex;align-items:flex-end;justify-content:center;gap:2px;padding:0 1px}
.bars i{display:block;width:100%;max-width:14px;border-radius:3px 3px 0 0}
.colbtn span{height:34px;display:grid;place-items:center;font-size:0.6875rem;color:var(--muted);overflow:hidden;white-space:nowrap}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 14px;font-size:0.75rem;color:var(--muted);margin:8px 0 14px}
.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:5px}
.dates{display:flex;gap:10px;flex-wrap:wrap}.dates label{flex:1;min-width:140px;font-size:0.8125rem;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.dates input{min-height:2.875rem;border-radius:12px;border:1px solid var(--border);background:var(--card);padding:0 10px;font-size:0.9375rem}
.toast{position:fixed;inset-inline:16px;bottom:calc(86px + env(safe-area-inset-bottom,0px));max-width:448px;margin:0 auto;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 16px;z-index:30;font-size:0.9375rem;text-align:center;box-shadow:0 6px 24px rgba(0,0,0,.4)}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:40}
.dlg{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:20px;width:100%;max-width:400px}
.dlg h3{margin:0 0 8px;font-size:1.1875rem}.dlg p{margin:0 0 16px;color:var(--muted);line-height:1.7;font-size:0.9375rem}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.dlg .acts button{min-height:2.75rem;padding:0 16px;border-radius:12px;border:0;background:transparent;font-size:1rem;font-weight:700;color:var(--green)}
.dlg .acts button.d{color:var(--danger)}
.note{font-size:0.75rem;color:var(--muted);line-height:1.7;text-align:center}
.splash{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:24px}
.splash .logo{width:120px;height:120px;border-radius:50%;background:var(--green-d);display:grid;place-items:center;color:var(--green);margin-bottom:12px}
.splash .logo svg{width:64px;height:64px}
.splash h1{font-size:4rem;font-weight:800;margin:0;line-height:1.1}
.splash .bar2{width:28px;height:6px;border-radius:3px;background:var(--green);margin-top:56px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ───── Liquid glass: translucent, blurred, light-edged surfaces over a coloured backdrop ───── */
:root{
  --card:rgba(255,255,255,.07); --nav:rgba(18,28,24,.55); --border:rgba(255,255,255,.14); --ring:rgba(255,255,255,.1);
  --green-d:rgba(74,222,128,.17); --green-b:rgba(74,222,128,.42);
  --protein-bg:rgba(124,155,255,.17); --carbs-bg:rgba(255,154,77,.17); --fat-bg:rgba(255,210,63,.16);
  --danger-bg:rgba(255,122,122,.12); --danger-b:rgba(255,122,122,.4);
  --glass-blur:blur(22px) saturate(180%);
  --spec:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -1px 0 rgba(255,255,255,.05),inset 0 0 18px rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.35);
}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60vmax 60vmax at 105% -5%,rgba(74,222,128,.34),transparent 60%),
  radial-gradient(55vmax 55vmax at -10% 38%,rgba(124,155,255,.30),transparent 60%),
  radial-gradient(50vmax 50vmax at 95% 85%,rgba(255,154,77,.26),transparent 60%),
  radial-gradient(40vmax 40vmax at 10% 100%,rgba(255,210,63,.14),transparent 60%),var(--bg)}
#root{background:transparent}
.card,.chip,.field,.btn,.btn-i.out,.dlg,.toast,.macro,.colbtn.on,.num,.nav,.hdr,.stick-bottom,.dates input,.sw input{-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
.card,.chip,.btn,.btn-i.out,.macro,.dates input{box-shadow:var(--spec)}
.card,.btn,.macro,.chip,.btn-i.out{position:relative;overflow:hidden}
.card::after,.btn::after,.macro::after,.chip::after,.btn-i.out::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(135deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.04) 28%,transparent 55%,rgba(255,255,255,.06) 100%)}
.card{border-radius:22px}
.card.date-card{overflow:visible}
.card.green{background:var(--green-d)}
.btn,.chip{border-radius:18px}
.btn.primary{background:linear-gradient(180deg,rgba(110,240,160,.95),rgba(52,200,110,.9));color:#06210f;border-color:rgba(255,255,255,.45);box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,80,30,.25),0 8px 24px rgba(74,222,128,.35)}
.btn.primary::after{background:linear-gradient(180deg,rgba(255,255,255,.4),transparent 55%)}
.btn.soft{background:var(--green-d)}
.btn.line{background:rgba(255,255,255,.05)}
.btn.danger{background:var(--danger-bg)}
.chip.on{background:rgba(74,222,128,.22);border-color:rgba(74,222,128,.6);box-shadow:var(--spec),0 0 18px rgba(74,222,128,.25)}
.btn-i.fill{background:linear-gradient(180deg,rgba(110,240,160,.95),rgba(52,200,110,.9));box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px rgba(74,222,128,.4)}
.btn-i.out{border-radius:16px}
.btn,.chip,.card,.btn-i{transition:transform .15s ease,background-color .2s ease}
.btn:active,.chip:active,button.card:active,.btn-i:active{transform:scale(.97)}
.field,.num,.dates input{background:rgba(0,0,0,.28);border-color:var(--border);box-shadow:inset 0 2px 6px rgba(0,0,0,.35),inset 0 -1px 0 rgba(255,255,255,.08);border-radius:16px}
.field:focus,.num:focus{border-color:rgba(74,222,128,.7);box-shadow:inset 0 2px 6px rgba(0,0,0,.35),0 0 0 3px rgba(74,222,128,.18)}
.ibox{box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.08)}
.hdr{background:rgba(13,19,17,.45);border-bottom:1px solid rgba(255,255,255,.08)}
.stick-bottom{background:rgba(13,19,17,.5);border-top:1px solid var(--border)}
.nav{inset-inline:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));max-width:456px;padding:6px;border:1px solid var(--border);border-radius:30px;background:var(--nav);box-shadow:var(--spec)}
.nav button{border-radius:24px;min-height:3.5rem}
.pill{border-radius:16px}
.nav button.on .pill{background:rgba(74,222,128,.2);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 16px rgba(74,222,128,.25)}
.screen{padding-bottom:124px}.screen.pushed{padding-bottom:24px}
.toast{bottom:calc(98px + env(safe-area-inset-bottom,0px));border-radius:20px;box-shadow:var(--spec);background:rgba(30,42,37,.6)}
.scrim{background:rgba(5,10,8,.5);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.dlg{background:rgba(32,46,40,.6);border-radius:28px;box-shadow:var(--spec)}
.dlg .acts button{border-radius:14px;background:rgba(255,255,255,.08)}
.colbtn.on{background:rgba(255,255,255,.1)}
.bars i{box-shadow:inset 0 1px 0 rgba(255,255,255,.4)}
.ring svg circle:last-child{filter:drop-shadow(0 0 8px rgba(74,222,128,.55))}
.menu button+button{border-top-color:rgba(255,255,255,.1)}
.divider,.stat+.stat{border-color:rgba(255,255,255,.1)}
.splash .logo{box-shadow:var(--spec),0 0 50px rgba(74,222,128,.3);border:1px solid var(--border)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root{--card:#16201C;--nav:#101814;--glass-blur:none}.dlg,.toast{background:#16201C}}
.copy{text-align:center;font-size:0.75rem;line-height:1.9;color:var(--muted);margin-top:24px}.splash .copy{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));inset-inline:0}

@media (max-width:380px){
  .macros{gap:6px}.macro{padding:10px 8px}
  .chip{padding:0 10px}
  .row.gc{flex-direction:column;align-items:stretch!important;gap:6px}.row.gc .chips{width:100%;flex:none}.row.gc .chip{overflow:visible}.row.gc>span{width:auto!important}
  .nav button{font-size:.7rem}
  .card .num{width:84px!important;font-size:1.1rem}
  .screen{padding-inline:12px}
  .stick-bottom{padding-inline:12px}
}
.chips.eq .chip{white-space:normal;line-height:1.25;min-height:46px}
.chips.scroll .chip{flex:none!important;padding:0 16px!important;white-space:nowrap!important;min-width:max-content}
.chips.scroll{align-items:center}

/* ───── الإعداد الإلزامي ───── */
.onb-head{text-align:center;padding:18px 4px 6px}
.onb-head h1{margin:0;font-size:1.75rem;font-weight:800;background:linear-gradient(100deg,#bff7d4,#4ADE80);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
.onb-head p{margin:8px 0 0;font-size:.9375rem;line-height:1.8;color:var(--muted)}
.onb-head b{color:var(--green);font-weight:700}
.bad{border-color:var(--danger)!important;box-shadow:0 0 0 3px rgba(255,122,122,.18)!important}
[data-g].bad{border-radius:14px;box-shadow:0 0 0 2px rgba(255,122,122,.55)!important}
.err{margin:12px 0 0;text-align:center;font-size:.875rem;font-weight:700;color:var(--danger);min-height:1.2em}
</style>
<style>
/* ───── نظام الحركة: منحنيات ثابتة، كل صفحة بحركة دخول مختلفة ───── */
:root{--ease:cubic-bezier(.16,1,.3,1);--spring:cubic-bezier(.34,1.56,.64,1);--soft:cubic-bezier(.4,0,.2,1)}
button{position:relative;overflow:hidden}
.card.date-card{overflow:visible}
.btn,.chip,.card,.btn-i,.nav button,.colbtn{transition:transform .34s var(--spring),background-color .25s var(--soft),border-color .25s var(--soft),box-shadow .3s var(--soft),opacity .2s}
.btn:active,.chip:active,button.card:active,.card[data-a]:active{transform:scale(.965);transition-duration:.12s}
.btn-i:active{transform:scale(.86);transition-duration:.12s}
.nav button:active{transform:scale(.92);transition-duration:.12s}
.btn-i svg,.pill svg{transition:transform .38s var(--spring)}
.btn-i.fill:active svg{transform:rotate(90deg) scale(1.12)}
.hdr .btn-i:active svg{transform:translateX(5px)}
.field{transition:border-color .25s var(--soft),box-shadow .3s var(--soft)}
/* تموّج اللمس */
.rp{position:absolute;border-radius:50%;pointer-events:none;z-index:2;transform:scale(0);background:radial-gradient(circle,rgba(255,255,255,.34) 0%,rgba(74,222,128,.2) 42%,transparent 70%);animation:rp .7s var(--ease) forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
/* مفاتيح الحركة */
@keyframes fadeOnly{from{opacity:0}}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}}
@keyframes riseBlur{from{opacity:0;transform:translateY(26px) scale(.985);filter:blur(7px)}}
@keyframes popScale{from{opacity:0;transform:scale(.9) translateY(14px)}}
@keyframes tiltIn{from{opacity:0;transform:perspective(700px) rotateX(-16deg) translateY(18px);transform-origin:50% 0}}
@keyframes slideStart{from{opacity:0;transform:translateX(-30px)}}
@keyframes slideEnd{from{opacity:0;transform:translateX(30px)}}
@keyframes tileIn{from{opacity:0;transform:translateY(14px) scale(.97)}}
@keyframes sheetUp{from{transform:translateY(64px)}}
@keyframes slideIn{from{transform:translateX(-48px)}}
@keyframes unfold{from{transform:perspective(900px) rotateX(-10deg) scale(.95);transform-origin:50% 0}}
@keyframes zoomSettle{from{transform:scale(1.06)}}
@keyframes backIn{from{transform:translateX(42px)}}
@keyframes ringDraw{from{stroke-dasharray:0 1200}}
@keyframes barGrow{from{transform:scaleX(0)}}
@keyframes growY{from{transform:scaleY(0)}}
@keyframes pillPop{from{transform:scale(.55);opacity:.2}}
@keyframes iconBounce{from{transform:translateY(9px) scale(.7) rotate(-12deg)}}
@keyframes chipPop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes qaDone{0%{transform:scale(.7)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes dlgIn{from{opacity:0;transform:translateY(30px) scale(.9)}}
@keyframes dlgOut{to{opacity:0;transform:translateY(16px) scale(.94)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes toastIn{from{opacity:0;transform:translateY(26px) scale(.92)}}
@keyframes toastOut{to{opacity:0;transform:translateY(16px) scale(.96)}}
/* دخول الصفحات: الرئيسية = صعود مع ضبابية · الوجبات = تكبير · التقارير = ميلان · المزيد = انزلاق جانبي */
.screen[data-anim]>*{animation-duration:.62s;animation-timing-function:var(--ease);animation-fill-mode:backwards;animation-delay:calc(var(--i,0)*55ms + 60ms)}
.screen[data-anim="home"]>*{animation-name:riseBlur}
.screen[data-anim="add"]>*{animation-name:popScale}
.screen[data-anim="reports"]>*{animation-name:tiltIn}
.screen[data-anim="more"]>*{animation-name:slideStart}
/* مكتبة الأطعمة = ورقة تصعد من الأسفل · إضافة طعام = انزلاق من الجانب · تفاصيل الوجبة = بطاقة تنفتح · الأهداف = تكبير ناعم */
.screen[data-anim="search"]{animation:sheetUp .6s var(--ease) backwards}
.screen[data-anim="search"]>*{animation-name:fadeUp;animation-duration:.5s;animation-delay:calc(var(--i,0)*40ms + 120ms)}
.screen[data-anim="search"] #res>*,.screen[data-anim="add"] .rc{animation:tileIn .5s var(--ease) backwards;animation-delay:calc(var(--k,0)*30ms + .3s)}
.screen[data-anim="food"]{animation:slideIn .55s var(--ease) backwards}
.screen[data-anim="food"]>*{animation-name:fadeUp;animation-duration:.45s;animation-delay:calc(var(--i,0)*35ms + 140ms)}
.screen[data-anim="meal"]{animation:unfold .65s var(--ease) backwards}
.screen[data-anim="meal"]>*{animation-name:popScale;animation-duration:.5s;animation-delay:calc(var(--i,0)*50ms + 150ms)}
.screen[data-anim="goals"]{animation:zoomSettle .7s var(--ease) backwards}
.screen[data-anim="goals"]>*{animation-name:riseBlur;animation-duration:.6s;animation-delay:calc(var(--i,0)*45ms + 120ms)}
.screen[data-anim="back"]{animation:backIn .42s var(--ease) backwards}
.screen[data-anim="back"]>*{animation-name:fadeOnly;animation-duration:.35s;animation-delay:0s}
/* تبديل اليوم: المحتوى ينزلق باتجاه الضغط */
.screen[data-anim="dayPrev"]>*{animation-name:slideEnd}
.screen[data-anim="dayNext"]>*{animation-name:slideStart}
.screen[data-anim^="day"]>*{animation-duration:.45s;animation-delay:calc(var(--i,0)*28ms)}
.screen[data-anim^="day"]>.date-card,.screen[data-anim^="day"]>.row:first-child{animation:none}
.screen[data-anim="rep"]>*{animation:none}
/* حلقة السعرات والأشرطة */
.screen[data-anim="home"] .ring svg circle:last-child,.screen[data-anim^="day"] .ring svg circle:last-child{animation:ringDraw 1.3s var(--ease) .25s backwards}
.screen[data-anim="home"] .bar i,.screen[data-anim^="day"] .bar i{transform-origin:100% 50%;animation:barGrow .9s var(--ease) .45s backwards}
.screen[data-anim="reports"] .bars i,.screen[data-anim="rep"] .bars i{transform-origin:50% 100%;animation:growY .8s var(--ease) backwards;animation-delay:calc(var(--n,0)*16ms + .2s)}
/* شريط التنقل */
.nav.anim button.on .pill{animation:pillPop .6s var(--spring) backwards}
.nav.anim button.on .pill svg{animation:iconBounce .7s var(--spring) .05s backwards}
.chip.on{animation:chipPop .45s var(--spring)}
.qa.done{animation:qaDone .6s var(--spring)}
/* النوافذ والإشعارات */
.scrim{animation:fadeOnly .25s var(--soft) backwards}
.scrim .dlg{animation:dlgIn .5s var(--spring) backwards}
.scrim.out{animation:fadeOut .22s var(--soft) forwards;pointer-events:none}
.scrim.out .dlg{animation:dlgOut .22s var(--soft) forwards}
.toast{animation:toastIn .55s var(--spring) backwards}
.toast.out{animation:toastOut .3s var(--soft) forwards}
/* الشعار في الرئيسية */
.brand{display:inline-flex;align-items:center;gap:10px;font-size:1.75rem;font-weight:800;background:linear-gradient(100deg,#fff 15%,var(--green) 110%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .bm{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--green-d);border:1px solid var(--green-b);color:var(--green);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 0 16px rgba(74,222,128,.25)}
.brand .bm svg{width:20px;height:20px}
/* ───── واجهة البداية (Splash) ───── */
.splash{position:relative;overflow:hidden;isolation:isolate;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;text-align:center;padding:24px}
.splash .orb{position:absolute;border-radius:50%;filter:blur(64px);z-index:-1;animation:orbIn 1.6s var(--ease) backwards,orbFloat 10s ease-in-out 1.6s infinite alternate}
.splash .o1{width:min(110vw,520px);aspect-ratio:1;background:radial-gradient(circle,rgba(74,222,128,.5),transparent 66%);top:-16%;inset-inline-end:-32%}
.splash .o2{width:min(100vw,460px);aspect-ratio:1;background:radial-gradient(circle,rgba(124,155,255,.42),transparent 66%);bottom:-12%;inset-inline-start:-36%;animation-delay:.2s,1.8s;animation-duration:1.6s,13s}
.splash .o3{width:min(70vw,300px);aspect-ratio:1;background:radial-gradient(circle,rgba(255,154,77,.3),transparent 66%);bottom:12%;inset-inline-end:-18%;animation-delay:.4s,2s;animation-duration:1.6s,11s}
@keyframes orbIn{from{opacity:0;transform:scale(.6)}}
@keyframes orbFloat{to{transform:translate(-7%,6%) scale(1.14)}}
.splash .mark{position:relative;width:min(46vw,190px);aspect-ratio:1;display:grid;place-items:center;margin-bottom:24px;animation:markIn 1.1s var(--ease) backwards,breathe 5s ease-in-out 1.8s infinite}
.splash .mark::before{content:"";position:absolute;inset:-22%;border-radius:50%;z-index:-1;background:radial-gradient(circle,rgba(74,222,128,.4),transparent 62%);animation:glowIn 1.8s var(--ease) .3s backwards,glowPulse 3.4s ease-in-out 2.1s infinite alternate}
.splash .mark svg{width:100%;height:100%;overflow:visible}
@keyframes markIn{from{opacity:0;transform:scale(.7) rotate(-14deg)}}
@keyframes breathe{50%{transform:translateY(-6px) scale(1.02)}}
@keyframes glowIn{from{opacity:0;transform:scale(.5)}}
@keyframes glowPulse{from{opacity:.75;transform:scale(.96)}to{opacity:1;transform:scale(1.08)}}
.mk-track{stroke:rgba(255,255,255,.12)}
.mk-arc{stroke-dasharray:326.7;stroke-dashoffset:71.9;animation:arcDraw 1.5s cubic-bezier(.65,0,.2,1) .2s backwards}

@keyframes dotOrbit{from{transform:rotate(0deg)}}

@keyframes flameDraw{from{stroke-dashoffset:1}}
@keyframes flameFill{from{fill-opacity:0}}

.mk-sp.s1{animation-delay:2.4s}.mk-sp.s2{animation-delay:3.1s}.mk-sp.s3{animation-delay:3.7s}
@keyframes spark{0%{opacity:0;transform:translateY(8px) scale(.6)}20%{opacity:1}100%{opacity:0;transform:translateY(-22px) scale(.2)}}
.splash .nm{position:relative;display:inline-block;margin:0;padding:.06em .12em .14em;font-size:clamp(3.6rem,18vw,4.8rem);font-weight:800;line-height:1.15;background:linear-gradient(100deg,#bff7d4 0%,#fff 22%,#5eea93 45%,#fff 70%,#bff7d4 100%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:nameIn 1.2s var(--ease) 1s backwards,shine 3.6s ease-in-out 2.3s infinite}
@keyframes nameIn{from{opacity:0;transform:translateY(24px);filter:blur(12px);clip-path:inset(0 0 0 100%)}}

.splash .ln{position:relative;overflow:hidden;width:68px;height:3px;border-radius:2px;background:rgba(255,255,255,.14);margin-top:36px;animation:lineIn .7s var(--ease) 1.75s backwards}

@keyframes lineIn{from{width:0;opacity:0}}
@keyframes ldr{from{transform:translateX(-120%)}to{transform:translateX(260%)}}
.splash .sb{margin-top:16px;font-size:1rem;color:var(--muted);animation:fadeUp .8s var(--ease) 1.9s backwards}
.splash .copy{animation:fadeOnly 1s ease 2.2s backwards}
.splash.out{animation:splashOut .55s var(--ease) forwards;pointer-events:none}
@keyframes splashOut{to{opacity:0;transform:scale(1.06);filter:blur(10px)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* ───────── الأطعمة المستخدمة مؤخراً ───────── */
function recentFrom(e){
  const g=+e.grams; if(!(g>0))return null;
  const r=x=>Math.round(x*100/g*10)/10;
  return{name:e.name,category:'مستخدم مؤخراً',kcal:r(e.kcal),protein:r(e.protein),carbs:r(e.carbs),fat:r(e.fat),estimate:false,u:e.unit,w:(e.unit==='p'&&e.qty>0)?Math.round(g/e.qty*10)/10:100,q:e.qty};
}
function deriveRecent(entries){
  const out=[],seen=new Set();
  for(let i=entries.length-1;i>=0&&out.length<30;i--){const f=recentFrom(entries[i]);if(!f)continue;const k=f.name+'|'+f.u;if(seen.has(k))continue;seen.add(k);out.push(f);}
  return out;
}
function touchRecent(e){
  const f=recentFrom(e); if(!f)return;
  D.recent=[f].concat((D.recent||[]).filter(x=>!(x.name===f.name&&x.u===f.u))).slice(0,30);
}
/* ───────── مكتبة الأطعمة ───────── */
function parseUnit(c){if(c==='l')return{u:'l',w:250};const m=/^p(\d+(?:\.\d+)?)$/.exec(c||'');return m?{u:'p',w:+m[1]}:{u:'g',w:100};}
const LIB=FOODS.map(a=>{const q=parseUnit(a[7]);return{name:a[0],category:a[1],kcal:a[2],protein:a[3],carbs:a[4],fat:a[5],estimate:a[6]==='E',u:q.u,w:q.w,norm:normAr(a[0])};});
const UNIT={p:{n:'وحدة',step:1,def:1},g:{n:'غرام',step:10,def:100},l:{n:'لتر',step:0.25,def:0.25}};
const UNIT_NAMES={p:'بالوحدة',g:'بالغرام',l:'باللتر'};
const fmtQ=v=>String(Math.round(v*100)/100);
function entryQty(e){if(e.unit==='p')return fmtQ(e.qty)+' وحدة · '+fmtNum(e.grams)+' غ';if(e.unit==='l')return fmtQ(e.qty)+' لتر';return fmtNum(e.grams)+' غ';}
const CATS=[...new Set(LIB.map(f=>f.category))];
function searchFoods(q,cat){
  const tk=normAr(q).split(/\s+/).filter(Boolean);
  const ok=n=>tk.every(t=>n.includes(t));
  const out=[];
  if(cat==='الكل'||cat==='أطعمتي')D.userFoods.forEach(f=>{if(ok(normAr(f.name)))out.push({f:f,custom:true});});
  if(cat==='مؤخراً')(D.recent||[]).forEach(f=>{if(ok(normAr(f.name)))out.push({f:f,custom:false,recent:true});});
  if(cat!=='أطعمتي'&&cat!=='مؤخراً')LIB.forEach(f=>{if((cat==='الكل'||f.category===cat)&&ok(f.norm))out.push({f:f,custom:false});});
  return out;
}
function calcTargets(p){
  const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='m'?5:-161);
  const factor={low:1.375,mid:1.55,high:1.725}[p.activity]||1.55;
  const adj={lose:-500,keep:0,gain:300}[p.goal]||0;
  const perKg={lose:2.2,keep:1.6,gain:2.0}[p.goal]||1.6;
  let kcal=Math.round((bmr*factor+adj)/10)*10; if(kcal<0)kcal=0;
  const protein=Math.round(p.weight*perKg);
  const fat=Math.round(kcal*0.25/9);
  let carbs=Math.round((kcal-protein*4-fat*9)/4); if(carbs<0)carbs=0;
  return{kcal,protein,carbs,fat};
}

function reportBuckets(){
  const r=V.rep, g=D.targets;
  const dayT=d=>sum(dayEntries(dateKey(d)));
  let b=[],label='';
  if(r.period==='month'){
    const first=new Date(r.anchor.getFullYear(),r.anchor.getMonth(),1), n=new Date(r.anchor.getFullYear(),r.anchor.getMonth()+1,0).getDate();
    const days=[];for(let i=0;i<n;i++)days.push(dayT(addDays(first,i)));
    for(let i=0;i<n;i+=7){const ch=days.slice(i,i+7).filter(x=>x.kcal>0),t=sum(ch),c=ch.length||1;
      b.push({label:'الأسبوع '+(i/7+1),t:ch.length?{kcal:t.kcal/c,protein:t.protein/c,carbs:t.carbs/c,fat:t.fat/c}:t});}
    label=MONTHS[r.anchor.getMonth()]+' '+r.anchor.getFullYear();
  }else{
    let from,to;
    if(r.period==='custom'){
      if(!r.from||!r.to)return{b:[],label:'اختر الفترة'};
      from=keyDate(r.from);to=keyDate(r.to);if(to<from){const x=from;from=to;to=x;}
      if((to-from)/864e5>30)from=addDays(to,-30);
    }else{to=r.anchor;from=addDays(to,-6);}
    for(let d=from;d<=to;d=addDays(d,1))b.push({label:WEEKDAYS[d.getDay()],t:dayT(d)});
    label=from.getMonth()===to.getMonth()&&from.getFullYear()===to.getFullYear()?from.getDate()+' - '+to.getDate()+' '+MONTHS[to.getMonth()]+' '+to.getFullYear():from.getDate()+' '+MONTHS[from.getMonth()]+' - '+to.getDate()+' '+MONTHS[to.getMonth()]+' '+to.getFullYear();
  }
  return{b:b,label:label};
}

function animateIn(){

  sc.dataset.anim=kind;
  const nav=$root.querySelector('.nav'); if(nav&&NAV_TABS.indexOf(kind)>-1)nav.classList.add('anim');
  if(kind==='home'||kind.indexOf('day')===0)countUp();

  m.innerHTML='<div class="dlg" role="dialog" aria-modal="true"><h3>'+esc(title)+'</h3>'+(body?'<p>'+body+'</p>':'')+(input!==undefined?'<input class="field" id="m-in" value="'+esc(input)+'" autocomplete="off">':'')+'<div class="acts"></div></div>';
  const acts=m.querySelector('.acts');
  btns.forEach(b=>{const el=document.createElement('button');el.textContent=b.label;if(b.cls)el.className=b.cls;el.onclick=()=>{const v=input!==undefined?m.querySelector('#m-in').value:null;m.remove();if(b.fn)b.fn(v);};acts.appendChild(el);});
  m.addEventListener('click',e=>{if(e.target===m)m.remove();});
  $root.appendChild(m);
  const i=m.querySelector('#m-in');if(i)i.focus();else acts.lastChild.focus();
}

function checkSetup(g,t){
  const bad=[];
  if(!String(g.name||'').trim())bad.push('g-name');
  if(!(g.weight>=20&&g.weight<=300))bad.push('g-weight');
  if(!(g.height>=90&&g.height<=250))bad.push('g-height');
  if(!(g.age>=10&&g.age<=100))bad.push('g-age');
  if(!g.sex)bad.push('sex');
  if(!g.activity)bad.push('activity');
  if(!g.goal)bad.push('goal');
  [['kcal','g-k'],['protein','g-p'],['carbs','g-c'],['fat','g-f']].forEach(p=>{if(!(t[p[0]]>0))bad.push(p[1]);});
  return bad;
}
function markBad(ids){
  document.querySelectorAll('.bad').forEach(e=>e.classList.remove('bad'));
  let first=null;
  ids.forEach(id=>{const el=document.getElementById(id)||document.querySelector('[data-g="'+id+'"]');if(el){el.classList.add('bad');if(!first)first=el;}});
  if(first){first.scrollIntoView({block:'center',behavior:'smooth'});if(first.tagName==='INPUT')try{first.focus({preventScroll:true});}catch(e){}}
}
/* ───────── الأفعال ───────── */
const A={
  skipSplash(){if(V.leaving)return;V.leaving=true;const sp=document.querySelector('.splash');if(sp)sp.classList.add('out');setTimeout(()=>{V.splash=false;V.leaving=false;NAV='home';render();},520);},
  tab(el){const t=+el.dataset.v,same=(t===V.tab&&!V.stack.length);V.tab=t;popAll();NAV=same?null:NAV_TABS[t];render();window.scrollTo(0,0);},
  pop(){const s=top();if(s&&s.onboard)return;pop();},
  shift(el){V.date=addDays(V.date,+el.dataset.v);NAV=+el.dataset.v<0?'dayPrev':'dayNext';render();},
  setMeal(el){V.meal=el.dataset.v;document.querySelectorAll('[data-a="setMeal"]').forEach(b=>b.classList.toggle('on',b.dataset.v===V.meal));},
  openMeal(el){push('meal',{meal:el.dataset.v});},
  newFood(){push('food',{food:null,per:[0,0,0,0],unit:'g',pw:100});},
  openSearch(){push('search',{q:'',cat:'الكل'});},
  mySearch(){push('search',{q:'',cat:'أطعمتي'});},
  soonCam(){modal('قريباً','التعرف على الطعام بالكاميرا سيُضاف في نسخة لاحقة (يحتاج ربطاً بنموذج ذكاء اصطناعي يقرأ الصور).',[{label:'حسناً'}]);},
  soon(){toast('قريباً');},
  noop(){},
  clearQ(){const s=top();s.q='';s.cat='الكل';document.getElementById('sq').value='';refreshSearch();},
  cat(el){const s=top();s.cat=el.dataset.v;refreshSearch();},
  pickFood(el){const r=lastResults[+el.dataset.i];if(!r)return;const f=r.f;push('food',{food:f,per:[f.protein,f.carbs,f.fat,f.kcal],unit:f.u||'g',pw:f.w||100,qty:f.q});},
  recentAll(){push('search',{q:'',cat:'مؤخراً'});},
  delRecent(el){const r=lastResults[+el.dataset.i];if(!r)return;D.recent=D.recent.filter(x=>x!==r.f);save();refreshSearch();},
  quickAdd(el,ev){ev.stopPropagation();const r=lastResults[+el.dataset.i];if(!r||el.classList.contains('done'))return;const f=r.f;
    const q=f.q!=null?f.q:UNIT[f.u].def,g=f.u==='p'?q*f.w:(f.u==='l'?q*1000:q),k=x=>x*g/100,rd=x=>Math.round(x*10)/10;
    const e={id:D.nid++,date:dateKey(V.date),mealType:V.meal,name:f.name,unit:f.u,qty:q,grams:g,kcal:Math.round(k(f.kcal)),protein:rd(k(f.protein)),carbs:rd(k(f.carbs)),fat:rd(k(f.fat))};
    D.entries.push(e);touchRecent(e);save();el.classList.add('done');el.innerHTML=ic('check');
    toast('تمت إضافة "'+f.name+'" إلى '+MEALS[V.meal]);
    setTimeout(()=>{if(!top()&&V.tab===1)render();},1100);},
  delUserFood(el,ev){ev.stopPropagation();const id=+el.dataset.id;D.userFoods=D.userFoods.filter(f=>f.id!==id);save();refreshSearch();},
  gramsBump(el){const s=top(),g=document.getElementById('fe-g');g.value=fmtQ(Math.max(0,parseNum(g.value)+ +el.dataset.d*UNIT[s.unit].step));fillFood();},
  unit(el){const s=top();s.unit=el.dataset.v;document.getElementById('fe-g').value=UNIT[s.unit].def;document.querySelectorAll('#fe-units .chip').forEach(b=>b.classList.toggle('on',b.dataset.v===s.unit));fillFood();},
  calcKcal(){const v=id=>parseNum(document.getElementById(id).value);const k=Math.round(4*v('fe-p')+4*v('fe-c')+9*v('fe-f'));document.getElementById('fe-k').value=k;macroEdit('fe-k');},
  addEntry(){
    const name=document.getElementById('fe-name').value.trim();
    if(!name){toast('اكتب اسم الطعام أولاً');return;}
    const s=top(),v=id=>parseNum(document.getElementById(id).value);
    const e={id:D.nid++,date:dateKey(V.date),mealType:V.meal,name:name,unit:s.unit,qty:v('fe-g'),grams:gramsOf(),kcal:v('fe-k'),protein:v('fe-p'),carbs:v('fe-c'),fat:v('fe-f')};
    D.entries.push(e);touchRecent(e);
    const sv=document.getElementById('fe-save');
    if(sv&&sv.checked&&!s.food)D.userFoods.push({id:D.nid++,name:name,category:'أطعمتي',kcal:s.per[3],protein:s.per[0],carbs:s.per[1],fat:s.per[2],estimate:false,u:s.unit,w:s.unit==='p'?(parseNum(document.getElementById('fe-pw').value)||100):100});
    save();popAll();V.tab=0;NAV='home';render();window.scrollTo(0,0);toast('تمت إضافة "'+name+'" إلى '+MEALS[e.mealType]);
  },
  delEntry(el){D.entries=D.entries.filter(e=>e.id!==+el.dataset.id);save();render();},
  delMeal(el){const m=el.dataset.v;modal('حذف الوجبة؟','سيتم حذف كل الأطعمة في هذه الوجبة لهذا اليوم.',[{label:'إلغاء'},{label:'حذف',cls:'d',fn(){const k=dateKey(V.date);D.entries=D.entries.filter(e=>!(e.date===k&&e.mealType===m));save();pop();}}]);},
  addToMeal(el){V.meal=el.dataset.v;push('search',{q:'',cat:'الكل'});},
  period(el){V.rep.period=el.dataset.v;V.rep.sel=-1;NAV='rep';render();},
  repShift(el){const r=V.rep,d=+el.dataset.v;r.sel=-1;r.anchor=r.period==='month'?new Date(r.anchor.getFullYear(),r.anchor.getMonth()+d,1):addDays(r.anchor,7*d);NAV='rep';render();},
  selBar(el){V.rep.sel=+el.dataset.v;render();},
  goals(){push('goals',{g:{...D.profile},t:{...D.targets}});},
  bump(el){const i=document.getElementById(el.dataset.t);i.classList.remove('bad');const b0={'g-weight':65,'g-height':170,'g-age':25}[el.dataset.t]||0;const cur=i.value.trim()===''?b0:parseNum(i.value);i.value=fmtNum(Math.max(0,cur+ +el.dataset.d));goalsEdit();},
  gchip(el){const s=top();readGoals();s.g[el.dataset.key]=el.dataset.v;el.parentNode.classList.remove('bad');el.parentNode.querySelectorAll('.chip').forEach(b=>b.classList.toggle('on',b===el));},
  autoCalc(){const s=top();readGoals();
    if(s.onboard){const need=checkSetup(s.g,{kcal:1,protein:1,carbs:1,fat:1}).filter(x=>x!=='g-name');
      if(need.length){markBad(need);toast('أدخل الوزن والطول والعمر واختر الجنس والنشاط والهدف أولاً');return;}}
    s.t=calcTargets(s.g);fillGoals();document.querySelectorAll('#g-k,#g-p,#g-c,#g-f').forEach(e=>e.classList.remove('bad'));},
  saveGoals(){const s=top();readGoals();
    if(s.onboard){
      const bad=checkSetup(s.g,s.t),er=document.getElementById('g-err');
      if(bad.length){markBad(bad);if(er)er.textContent='أكمل الحقول المميّزة بالأحمر للمتابعة';toast('يرجى إكمال جميع البيانات');return;}
      D.profile={...D.profile,...s.g,name:String(s.g.name).trim(),done:true};D.targets={...s.t};save();
      V.stack=[];V.tab=0;NAV='home';render();window.scrollTo(0,0);toast('أهلاً بك '+D.profile.name+'، تم حفظ بياناتك');return;
    }
    D.profile={...D.profile,...s.g};D.targets={...s.t};save();pop();toast('تم حفظ بياناتك وأهدافك');},
  editName(){modal('الاسم','',[{label:'إلغاء'},{label:'حفظ',fn(v){v=(v||'').trim();if(v){D.profile.name=v;save();render();}}}],D.profile.name);},
  help(){modal('المساعدة','أضف وجباتك من تبويب «الوجبات»، وعدّل أهدافك من «المزيد». كل القيم الغذائية قابلة للتعديل. القيم المعلّمة «تقديري» تحتاج مراجعة حسب وصفتك. عند إضافة طعام اختر القياس: بالوحدة أو بالغرام أو باللتر. بياناتك تُحفظ في هذا المتصفح فقط.',[{label:'حسناً'}]);},
  share(){const u=location.href;const done=()=>toast('تم نسخ رابط الموقع');if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(done,()=>modal('رابط الموقع','<span style="user-select:all;word-break:break-all">'+esc(u)+'</span>',[{label:'حسناً'}]));}else modal('رابط الموقع','<span style="user-select:all;word-break:break-all">'+esc(u)+'</span>',[{label:'حسناً'}]);},
  wipe(){modal('مسح كل بياناتي؟','سيتم حذف سجل الوجبات وأطعمتي المحفوظة وبياناتك وأهدافك من هذا المتصفح، ولا يمكن التراجع.',[{label:'إلغاء'},{label:'مسح',cls:'d',fn(){D.profile={...DEF_PROFILE};D.targets={...DEF_TARGETS};D.entries=[];D.userFoods=[];D.recent=[];save();render();toast('تم مسح بياناتك');}}]);},
};
function macroEdit(id){
  // تعديل رقم يدوياً: نحسب القيمة لكل 100 غ من جديد
  const s=top();if(!s||s.name!=='food')return;
  const g=gramsOf();if(g<=0)return;
  const idx={'fe-p':0,'fe-c':1,'fe-f':2,'fe-k':3}[id];
  s.per[idx]=parseNum(document.getElementById(id).value)*100/g;
}
function goalsEdit(){const s=top();readGoals();noteGoals();}
['gesturestart','gesturechange','gestureend'].forEach(t=>document.addEventListener(t,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches&&e.touches.length>1)e.preventDefault();},{passive:false});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-a]');if(!el||!$root.contains(el))return;
  const fn=A[el.dataset.a];if(fn)fn(el,e);
});
document.addEventListener('input',e=>{
  const t=e.target,id=t.id;
  if(id==='sq'){top().q=t.value;refreshSearch();}
  else if(id==='fe-g'||id==='fe-pw'){if(parseNum(t.value)>0)fillFood();}
  else if(/^fe-[pcfk]$/.test(id))macroEdit(id);
  else if(/^g-/.test(id)&&top()&&top().name==='goals'){t.classList.remove('bad');goalsEdit();}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='pickdate'&&e.target.value){const nd=keyDate(e.target.value);NAV=nd<V.date?'dayPrev':'dayNext';V.date=nd;render();}
  if(id==='r-from'||id==='r-to'){V.rep[id==='r-from'?'from':'to']=e.target.value;V.rep.sel=-1;render();}
});
document.addEventListener('submit',e=>{
  if(e.target.id==='qform'){e.preventDefault();push('search',{q:document.getElementById('q').value,cat:'الكل'});}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.matches('[data-a][role=button]'))e.target.click();
  if(e.key==='Escape'){const m=document.getElementById('modal');if(m)m.remove();}
});
render();
setTimeout(()=>{if(V.splash)A.skipSplash();},3300);
})();
</script>
